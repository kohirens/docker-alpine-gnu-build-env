version: 2.1

# Anchors
default-env-vars: &default-env-vars
  DOCKER_BUILDKIT: 1

filter-semantic-tag: &filter-semantic-tag
  tags:
    only: /^v?\d+\.\d+\.\d+$/
  branches:
    ignore: /.*/

remote_worker: &remote_worker
  setup_remote_docker:
    version: edge
    docker_layer_caching: true

orbs:
  vr: kohirens/version-release@5.1.10

parameters:
  ctx_auto_release:
    default: "kohirens-automation"
    description: Secrets context
    type: string
  ctx_docker_hub:
    default: "kohirens-automation-dockerhub"
    description: Secrets context
    type: string
  triggered_flow:
    default: "workflow-selector"
    description: Workflow to be executed
    type: string
  variables_file:
    default: variables.sh
    type: string
  dh_img_repo:
    default: "kohirens/alpine-gnu-build-env"
    type: string
  dh_img_tag_file:
    default: "dh-image-tag.txt"
    type: string
  semver_file:
    default: "semver.txt"
    type: string

executors:
  image-builder:
    docker: # see https://circleci.com/developer/images/image/cimg/base
      - image: cimg/base:current
        auth:
          username: ${DH_USER}
          password: ${DH_API_TOKEN}
    resource_class: small
    environment:
      *default-env-vars
  go-get-latest:
    docker: # see https://github.com/kohirens/go-get-latest
      - image: kohirens/go-get-latest:0.7.2
        auth:
          username: ${DH_USER}
          password: ${DH_API_TOKEN}
    resource_class: small

jobs:
  fetch-code:
    executor: go-get-latest
    steps:
      - checkout
      - run:
          name: "Build custom environment variables file"
          command: |
            ALPINE_VER=$(go-get-latest alpine)
            echo "export ALPINE_VER='${ALPINE_VER}'" > <<pipeline.parameters.variables_file>>
            echo "${ALPINE_VER}" > <<pipeline.parameters.semver_file>>
            echo "${ALPINE_VER} latest" > <<pipeline.parameters.dh_img_tag_file>>
            chmod +x <<pipeline.parameters.variables_file>>
            cat <<pipeline.parameters.variables_file>>
      - persist_to_workspace:
          root: .
          paths: [ ./* ]

  build-n-test:
    executor: image-builder
    environment:
      <<: *default-env-vars
    steps:
      - attach_workspace: { at: . }
      - *remote_worker
      - run:
          name: "Build and test Docker image"
          command: |
            source <<pipeline.parameters.variables_file>>
            DH_IMG="<<pipeline.parameters.dh_img_repo>>:dev"
            docker build --rm -t "${DH_IMG}" --build-arg ALPINE_VER --target "test" .
            echo "test running the docker image built"
            docker run -it --entrypoint sh --rm "${DH_IMG}" /tmp/src/test.sh
            docker rmi "${DH_IMG}"

workflows:
  quality-control: # Run on all branches and PRs except main|auto-*
    jobs:
      - fetch-code:
          context: <<pipeline.parameters.ctx_docker_hub>>
          filters: { branches: { ignore: /main|auto-update-changelog/ } }
      - build-n-test:
          context: <<pipeline.parameters.ctx_auto_release>>
          requires: [ fetch-code ]

  workflow-selector:
    when:
      and:
        - equal: ["workflow-selector", <<pipeline.parameters.triggered_flow>>]
        - equal: [ main, <<pipeline.git.branch>> ]
    jobs:
      - fetch-code:
          context: <<pipeline.parameters.ctx_docker_hub>>
      - vr/workflow-selector:
          context: <<pipeline.parameters.ctx_auto_release>>
          tag_file: <<pipeline.parameters.semver_file>>
          requires: [ fetch-code ]
          do_checkout: false
          do_attach_workspace: true

  publish-changelog:
    when:
      and:
        - equal: ["publish-changelog", <<pipeline.parameters.triggered_flow>>]
    jobs:
      - fetch-code:
          context: <<pipeline.parameters.ctx_docker_hub>>
      - vr/publish-changelog:
          context: <<pipeline.parameters.ctx_auto_release>>
          tag_file: <<pipeline.parameters.semver_file>>
          requires: [ fetch-code ]
          do_checkout: false
          do_attach_workspace: true

  publish-release-tag:
    when:
      and:
        - equal: ["publish-release-tag", <<pipeline.parameters.triggered_flow>>]
    jobs:
      - fetch-code:
          context: <<pipeline.parameters.ctx_docker_hub>>
      - vr/tag-and-release: # release the code as its own semver
          context: <<pipeline.parameters.ctx_auto_release>>
          tag_file: <<pipeline.parameters.semver_file>>
          requires: [ fetch-code ]
          do_checkout: false
          do_attach_workspace: true
          owner: "kohirens"
          "repo": "docker-alpine-gnu-build-env"
          abort_dupe_release: true

  on-tag-release:
    jobs:
      - fetch-code:
          context: <<pipeline.parameters.ctx_docker_hub>>
          filters:
            <<: *filter-semantic-tag
      - vr/publish-docker-hub:
          context: <<pipeline.parameters.ctx_docker_hub>>
          filters:
            <<: *filter-semantic-tag
          requires: [ fetch-code ]
          tag_file: <<pipeline.parameters.dh_img_tag_file>>
          repository: <<pipeline.parameters.dh_img_repo>>
          do_checkout: false
          do_attach_workspace: true
          env_file: <<pipeline.parameters.variables_file>>
          build_args: "--build-arg ALPINE_VER=${ALPINE_VER}"

  scheduled-weekly-check:
    when:
      and:
        - equal: ["scheduled-weekly-check", << pipeline.parameters.triggered_flow >>]
        - equal: [ main, << pipeline.git.branch >> ]
    jobs:
      - fetch-code:
          context: <<pipeline.parameters.ctx_docker_hub>>
      - build-n-test:
          context: <<pipeline.parameters.ctx_auto_release>>
          requires: [ fetch-code ]
      - vr/publish-docker-hub:
          context: <<pipeline.parameters.ctx_docker_hub>>
          requires: [ build-n-test ]
          tag_file: <<pipeline.parameters.dh_img_tag_file>>
          repository: <<pipeline.parameters.dh_img_repo>>
          do_checkout: false
          do_attach_workspace: true
          env_file: <<pipeline.parameters.variables_file>>
          build_args: "--build-arg ALPINE_VER=${ALPINE_VER}"